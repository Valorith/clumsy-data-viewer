name: Node runtime validation

on:
  pull_request:
    paths:
      - '.node-version'
      - 'package*.json'
      - 'backend/package*.json'
      - 'frontend/package*.json'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'railway.json'
      - '.github/workflows/node-runtime.yml'

permissions:
  contents: read

jobs:
  linux-and-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Build pristine Docker contexts before host dependency installs
        run: |
          docker build --tag node-backend-qa backend
          docker run --rm --entrypoint node node-backend-qa --version | grep -Fx v22.23.4
          docker run --rm --entrypoint npm node-backend-qa test
          docker build --tag static-frontend-qa frontend
          docker run --rm --entrypoint nginx static-frontend-qa -t
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix backend --omit=dev --no-audit --no-fund
      - run: npm ci --prefix frontend --include=dev --no-audit --no-fund
      - run: npm test --prefix backend
      - run: npm run build --prefix frontend
      - run: git diff --exit-code
